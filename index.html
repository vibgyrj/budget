<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget</title>
</head>
<body>
    <h1>Budget Management</h1>
    <button id="import">Import CSV</button>
    <button id="export">Export CSV</button>
    <script>
        document.getElementById('import').addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    const content = event.target.result;
                    const rows = content.split('\n');
                    // Assuming the first row is the header
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i].split('\t');
                        // Prefill data into the fields with empty quotes for text fields
                        // Add your prefill logic here based on your budget structure
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        document.getElementById('export').addEventListener('click', function() {
            const data = []; // Gather current budget data
            // Add logic to append your current budget data into the above array
            const csvContent = 'data:text/csv;charset=utf-8,' + data.map(e => e.join('\t')).join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', 'budget.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
